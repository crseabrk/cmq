name: Add Windows Icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-icon.yml"
      - "windows/tools/png-to-ico.mjs"

permissions:
  contents: write

jobs:
  generate-icon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render Windows icon layers from the macOS artwork
        run: |
          mkdir -p icon-work windows/CMQ.Windows/Assets
          for size in 16 24 32 48 64 128 256; do
            sips -z "$size" "$size" -s format png Assets/CMQ.icns --out "icon-work/$size.png"
          done
          node windows/tools/png-to-ico.mjs windows/CMQ.Windows/Assets/CMQ.ico icon-work/16.png icon-work/24.png icon-work/32.png icon-work/48.png icon-work/64.png icon-work/128.png icon-work/256.png

      - name: Commit Windows icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/CMQ.Windows/Assets/CMQ.ico
          git commit -m "Add CMQ application icon for Windows"
          git push

  rebuild-release:
    needs: generate-icon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish standalone Windows build
        run: dotnet publish windows/CMQ.Windows/CMQ.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output windows-release

      - name: Package updated build
        shell: pwsh
        run: Compress-Archive -Path windows-release\* -DestinationPath CMQ-Windows-x64.zip

      - name: Replace release download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload windows-v1.0.0 CMQ-Windows-x64.zip --repo "${{ github.repository }}" --clobber
