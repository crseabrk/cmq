name: Add Windows Icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-icon.yml"
      - "windows/CMQ.Windows/CMQ.Windows.csproj"

permissions:
  contents: write

jobs:
  icon-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install ImageMagick
        shell: pwsh
        run: choco install imagemagick -y --no-progress

      - name: Convert macOS icon for Windows
        shell: pwsh
        run: |
          $magick = Get-ChildItem "C:\Program Files\ImageMagick-*\magick.exe" | Select-Object -First 1 -ExpandProperty FullName
          New-Item -ItemType Directory -Force "windows\CMQ.Windows\Assets" | Out-Null
          & $magick "Assets\CMQ.icns[0]" -define icon:auto-resize=256,128,64,48,32,24,16 "windows\CMQ.Windows\Assets\CMQ.ico"

      - name: Commit Windows icon
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/CMQ.Windows/Assets/CMQ.ico
          git commit -m "Add CMQ application icon for Windows"
          git push

      - name: Publish standalone Windows build
        run: dotnet publish windows/CMQ.Windows/CMQ.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output windows-release

      - name: Package updated build
        shell: pwsh
        run: Compress-Archive -Path windows-release\* -DestinationPath CMQ-Windows-x64.zip

      - name: Replace release download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload windows-v1.0.0 CMQ-Windows-x64.zip --repo "${{ github.repository }}" --clobber
