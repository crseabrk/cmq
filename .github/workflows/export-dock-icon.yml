name: Export Dock Icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-dock-icon.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export 512px PNG
        run: |
          sips -z 512 512 -s format png Assets/CMQ.icns --out Assets/CMQ-512.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/CMQ-512.png
          git commit -m "Add 512px CMQ dock icon"
          git push
