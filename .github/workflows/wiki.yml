name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki repository
        env:
          WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          git clone "$WIKI_URL" wiki-publish || {
            mkdir -p wiki-publish
            git -C wiki-publish init
            git -C wiki-publish remote add origin "$WIKI_URL"
          }

      - name: Copy wiki pages
        run: |
          cp wiki/Home.md wiki-publish/Home.md
          cp wiki/_Sidebar.md wiki-publish/_Sidebar.md

      - name: Publish wiki
        run: |
          git -C wiki-publish config user.name "github-actions[bot]"
          git -C wiki-publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki-publish add Home.md _Sidebar.md
          git -C wiki-publish commit -m "Publish CMQ wiki" || exit 0
          git -C wiki-publish push origin HEAD:master
