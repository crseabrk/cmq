name: macOS test build

on:
  push:
    branches: [conflict-handling]
    paths:
      - "CMQ.swift"
      - "Info.plist"
      - "Assets/**"
      - "build.sh"
      - ".github/workflows/macos-test.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build CMQ
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Package test build
        run: ditto -c -k --sequesterRsrc --keepParent outputs/CMQ.app CMQ-macOS-arm64-test.zip
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: CMQ-macOS-arm64-test
          path: CMQ-macOS-arm64-test.zip
          if-no-files-found: error
