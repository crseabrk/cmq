name: Attach Dock Icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/attach-dock-icon.yml"

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach dock icon to Windows 1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload windows-v1.0.1 Assets/CMQ-512.png --repo "${{ github.repository }}"
