name: Windows

on:
  push:
    branches: [windows-port]
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore windows/CMQ.Windows/CMQ.Windows.csproj
      - name: Build
        run: dotnet build windows/CMQ.Windows/CMQ.Windows.csproj --configuration Release --no-restore
